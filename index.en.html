<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f9fb" />
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('portfolio-theme'); } catch {}
        const dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#121722' : '#f8f9fb';
      })();
    </script>
    <title>Adrián Vilella | Software Developer</title>
    <meta name="description" content="Portfolio of Adrián Vilella, junior software developer and Multimedia Engineer. Full-stack projects, web and desktop applications, APIs and digital tools." />
